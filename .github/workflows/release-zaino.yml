name: release
run-name: "Zaino AI Agent Beta ${{ inputs.version || '1.1.7' }}"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and release (default 1.1.7)"
        required: false
        type: string
        default: "1.1.7"

permissions:
  contents: write

env:
  ZAINO_VERSION: ${{ inputs.version || '1.1.7' }}
  OPENCODE_CHANNEL: beta
  # macOS has no Apple credentials on this repository, so the mac artifacts are ad-hoc signed.
  ZAINO_UNSIGNED: "1"
  # Windows does have to be signed: an unsigned installer is stopped by SmartScreen for every
  # user, and the updater has no publisher to verify. The "Package desktop" step requires signing
  # whenever an identity is configured (see there), so a broken setup fails the release instead of
  # quietly publishing an installer Windows warns about.

  # Job-level, so `if:` on the Azure login step can read it: `secrets` is not allowed in an `if`
  # expression, and the login has to be skipped on a Windows build that will not sign.
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  build-cli:
    name: "CLI ${{ matrix.cli_target }} (${{ matrix.host }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-26
            rust_target: aarch64-apple-darwin
            cli_target: opencode-darwin-arm64
          - host: macos-26-intel
            rust_target: x86_64-apple-darwin
            cli_target: opencode-darwin-x64-baseline
          - host: windows-2025
            rust_target: aarch64-pc-windows-msvc
            cli_target: opencode-windows-arm64
          - host: windows-2025
            rust_target: x86_64-pc-windows-msvc
            cli_target: opencode-windows-x64-baseline
          - host: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            cli_target: opencode-linux-x64-baseline
          - host: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            cli_target: opencode-linux-arm64
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile
        shell: bash

      - name: Build sidecar CLI
        run: bun ./packages/cli/script/build.ts --target=${{ matrix.cli_target }}
        shell: bash
        env:
          BUN_COMPILE_RELEASE: bun-v1.4.2
          OPENCODE_VERSION: ${{ env.ZAINO_VERSION }}
          OPENCODE_CHANNEL: beta
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: zaino-cli-${{ matrix.rust_target }}
          path: packages/cli/dist/*
          if-no-files-found: error

  build-desktop:
    name: "Desktop ${{ matrix.rust_target }} (${{ matrix.host }})"
    needs: build-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-26
            rust_target: aarch64-apple-darwin
            platform_flag: --mac --arm64
            install_flags: --os=darwin --cpu=arm64
          - host: macos-26-intel
            rust_target: x86_64-apple-darwin
            platform_flag: --mac --x64
            install_flags: --os=darwin --cpu=x64
          - host: windows-2025
            rust_target: aarch64-pc-windows-msvc
            platform_flag: --win --arm64
            install_flags: --cpu=*
          - host: windows-2025
            rust_target: x86_64-pc-windows-msvc
            platform_flag: --win
            install_flags: ""
          - host: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            platform_flag: --linux
            install_flags: ""
          - host: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            platform_flag: --linux --arm64
            install_flags: ""
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile ${{ matrix.install_flags }}
        shell: bash

      - name: Install linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm
        shell: bash

      - uses: actions/download-artifact@v4
        with:
          name: zaino-cli-${{ matrix.rust_target }}
          path: packages/cli/dist

      - name: Prepare desktop
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        shell: bash
        env:
          OPENCODE_VERSION: ${{ env.ZAINO_VERSION }}
          OPENCODE_CHANNEL: beta
          OPENCODE_CLI_TARGET: ${{ matrix.rust_target }}
          OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist

      - name: Build desktop
        run: bun run build
        working-directory: packages/desktop
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_VERSION: ${{ env.ZAINO_VERSION }}
          OPENCODE_CHANNEL: beta
          OPENCODE_CLI_TARGET: ${{ matrix.rust_target }}
          OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist

      # Azure Trusted Signing authenticates its own module through these; electron-builder's
      # hook in packages/desktop/electron-builder.config.ts calls the script that uses them.
      - name: Azure login
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Package desktop
        run: npx electron-builder ${{ matrix.platform_flag }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        shell: bash
        timeout-minutes: 60
        env:
          OPENCODE_VERSION: ${{ env.ZAINO_VERSION }}
          OPENCODE_CHANNEL: beta
          OPENCODE_CLI_TARGET: ${{ matrix.rust_target }}
          ZAINO_UNSIGNED: "1"
          ZAINO_REQUIRE_SIGNING: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT != '' && '1' || '0' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}

      - name: Create macOS .app.tar.gz
        if: runner.os == 'macOS'
        working-directory: packages/desktop/dist
        run: |
          if [[ "${{ matrix.rust_target }}" == "x86_64-apple-darwin" ]]; then
            APP_DIR="mac"
            OUT_NAME="zaino-desktop-mac-x64.app.tar.gz"
          else
            APP_DIR="mac-arm64"
            OUT_NAME="zaino-desktop-mac-arm64.app.tar.gz"
          fi
          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in $APP_DIR"
            exit 1
          fi
          tar -czf "$OUT_NAME" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: zaino-desktop-${{ matrix.rust_target }}
          path: packages/desktop/dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Kept apart per job: every Windows job writes `latest.yml` and every mac job writes
      # `latest-mac.yml`, so flattening here would keep only one architecture's feed.
      - uses: actions/download-artifact@v4
        with:
          pattern: zaino-desktop-*
          path: /tmp/zaino-artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Merge update feeds
        run: node packages/desktop/scripts/merge-update-feeds.mjs /tmp/zaino-artifacts /tmp/zaino-dist
        shell: bash

      - name: List artifacts
        run: ls -la /tmp/zaino-dist
        shell: bash

      - name: Publish release v${{ env.ZAINO_VERSION }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.ZAINO_VERSION }}
          name: Zaino AI Agent Beta ${{ env.ZAINO_VERSION }}
          body: |
            ## Zaino AI Agent Beta ${{ env.ZAINO_VERSION }}

            Standalone desktop client for the Zaino Gateway — Fast, Smart, Frontier and Fable models, signed in with your gateway account.

            ### Downloads
            - **macOS (Apple Silicon):** `zaino-desktop-mac-arm64.dmg`
            - **macOS (Intel):** `zaino-desktop-mac-x64.dmg`
            - **Windows (x64/arm64):** `zaino-desktop-win-*.exe`
            - **Linux:** `*.AppImage`, `*.deb`, `*.rpm`

            The app checks this release feed automatically and offers in-app updates.
          draft: false
          prerelease: false
          files: |
            /tmp/zaino-dist/*
          fail_on_unmatched_files: true
